[tool.uv]
dev-dependencies = [
  "ruff>=0.6.7",
]

[tool.uv.workspace]
members = [
  "meta_model",
  "pipe_catalog",
  "modeller",
  "pipe_workspace",
]

[tool.uv.sources]
meta_model = { workspace = true }
pipe_catalog = { workspace = true }
modeller = { workspace = true }
pipe_workspace = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py310"
src = [
  "meta_model",
  "pipe_catalog",
  "modeller",
  "pipe_workspace",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
extraPaths = [
  "meta_model/src",
  "pipe_catalog/src",
  "modeller/src",
  "pipe_workspace/src",
]
stubPath = "typings"
