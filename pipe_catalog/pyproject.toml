[project]
name = "pipe-catalog"
version = "0.1.0"
description = "Pipeline catalog definitions for the metadata-driven platform."
requires-python = ">=3.10"
dependencies = [
  "meta-model",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["pipe_catalog"]
